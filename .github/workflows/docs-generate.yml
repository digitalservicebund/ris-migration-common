name: Generate documentation

on:
  workflow_call:

permissions:
  contents: read

# Java/Gradle are set up with explicit steps below instead of a shared composite action like
# ris-literature's `./.github/actions/setup-java-gradle`. This workflow also runs when other repositories
# (e.g. ris-assertions-common) call pipeline.yml, and there `./.github/actions/...` would be looked up in
# the calling repository's checkout, where the action doesn't exist, so the step would fail.
jobs:
  generate-code-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Generate javadocs
        run: |
          ./gradlew javadoc \
            --configuration-cache \
            --build-cache \
            --no-daemon

      - name: Upload javadocs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-documentation
          retention-days: 3
          path: build/docs/javadoc/
